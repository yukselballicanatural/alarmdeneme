<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Natural Clinic — Uygulamalar</title>
<script src="i18n.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Panellerle AYNI font ailesi: Outfit (başlıklar) + Inter (gövde).
     Cormorant Garamond yalnızca marka logosunda kalıyor (index.html ile aynı). -->
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
<!-- Paylaşılan Liquid Glass katmanı: cam belirteçleri (--g-1, --edge, --sheen…),
     mesh zemin, sinematik tema anahtarı ve dil açılır listesi buradan geliyor.
     Bu sayfaya ÖZEL yerleşim aşağıdaki <style> içinde kalır. -->
<link rel="stylesheet" href="liquid-glass.css">
<link rel="stylesheet" href="liquid-glass-dark.css">
<script>
  // Tema, ilk boyamadan ÖNCE uygulanmalı — yoksa yanlış temada bir kare
  // görünüp "flaş" oluyor. Panellerle aynı localStorage anahtarı.
  (function () {
    var saved = localStorage.getItem('nc_theme') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    /* DİKKAT: .topbar'ın margin-top'u body'den DIŞARI taşıyordu (margin
       collapse) ve zemin mesh'i o kadar aşağıdan başlayıp en üstte html
       renginde bir şerit bırakıyordu. Boşluğu body'nin padding'i veriyor. */
    padding-top: 18px;
  }
  h1, h2, h3 { font-family: 'Outfit', sans-serif; }

  /* Zemin mesh'i paylaşılan katmandan geliyor; buradaki yalnızca yedek.
     Eski body::before/::after altın-yeşil lekeleri kaldırıldı: cam
     yüzeylerin arkasında panellerle AYNI mesh olmalı, yoksa iki sayfa
     birbirinin devamı gibi durmuyor. */
  html[data-theme="light"] body { color: var(--ink); }
  html[data-theme="dark"]  body { color: var(--d-ink); }

  /* İnce yatay tarama çizgisi — cam dokusuna hafif "ekran" hissi katıyor */
  .grain-line {
    position: fixed; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px);
    background-size: 100% 3px;
    pointer-events: none;
    opacity: .4;
    z-index: 0;
  }
  html[data-theme="light"] .grain-line {
    background-image: linear-gradient(rgba(23,43,99,0.022) 1px, transparent 1px);
    opacity: .5;
  }

  /* ─────────────────────────────────────────────────────────────────
     ÜST ÇUBUK — yüzen cam ada (sidebar'ın yatay karşılığı)
     ───────────────────────────────────────────────────────────────── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
    margin: 0 auto;
    max-width: 1180px;
    padding: 12px 18px;
    border-radius: 22px;
    position: relative; z-index: 60;
    -webkit-backdrop-filter: blur(30px) saturate(190%);
    backdrop-filter: blur(30px) saturate(190%);
  }
  html[data-theme="light"] .topbar {
    background: var(--g-1);
    border: 1px solid var(--edge-soft);
    box-shadow: var(--sh-1), var(--sheen);
  }
  html[data-theme="dark"] .topbar {
    background: var(--d-1);
    border: 1px solid var(--d-edge-soft);
    box-shadow: var(--d-sh-1), var(--d-sheen);
  }
  @media (max-width: 760px) { .topbar { margin: 0 12px; border-radius: 18px; } }

  /* Marka — serif logo, tek renk kimliği koruyor */
  .logo-mini-wrap { display: flex; flex-direction: column; }
  .logo-mini { display: flex; align-items: baseline; }
  .logo-mini-text { font-family: 'Cormorant Garamond', serif; font-size: 25px; font-weight: 500; letter-spacing: -0.5px; }
  .logo-mini-dot  { font-family: 'Cormorant Garamond', serif; font-size: 25px; font-style: italic; }
  .logo-mini-clinic { font-family: 'Cormorant Garamond', serif; font-size: 11px; letter-spacing: 4px; text-transform: lowercase; display: block; margin-top: 1px; margin-left: 1px; }
  html[data-theme="light"] .logo-mini-text { color: #1a1d26; }
  html[data-theme="light"] .logo-mini-dot,
  html[data-theme="light"] .logo-mini-clinic { color: #8a6a3b; }
  html[data-theme="dark"] .logo-mini-text { color: #f7f3ec; }
  html[data-theme="dark"] .logo-mini-dot,
  html[data-theme="dark"] .logo-mini-clinic { color: #c9a97f; }

  .topbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  /* Dil seçici: kapsül kutu KALDIRILDI — içine liquid-ui.js'in cam açılır
     listesi (.lang-dd) giriyor, kendi zemini var. Sadece genişlik veriyoruz. */
  .lang-toggle {
    background: none; border: none; padding: 0;
    width: 138px; flex-shrink: 0;
  }
  /* Panellerde liste YUKARI açılıyor (kontrol sidebar'ın altında).
     Burada kontrol sayfanın ÜSTÜNDE, o yüzden aşağı açılmalı.
     width:max-content şart: liste tetikleyici genişliğine kilitlenince
     "Türkçe"/"English" üç noktaya kırpılıyordu. */
  .lang-toggle .lang-menu {
    bottom: auto !important;
    top: calc(100% + 6px) !important;
    transform-origin: top center;
    right: 0 !important; left: auto !important;
    min-width: 100%;
    width: max-content;
  }
  .lang-toggle .lang-name { overflow: visible; text-overflow: clip; }

  /* Tema anahtarı — sidebar'daki kutucuğun kompakt hâli */
  #themeSwitch.cine-box { width: auto; gap: 10px; padding: 5px 7px 5px 12px; }

  .user-area { display: flex; align-items: center; gap: 11px; padding-left: 12px; }
  html[data-theme="light"] .user-area { border-left: 1px solid rgba(23,43,99,0.12); }
  html[data-theme="dark"]  .user-area { border-left: 1px solid rgba(255,255,255,0.10); }
  .user-info { text-align: right; }
  .user-name { font-size: 12.5px; font-weight: 700; letter-spacing: -0.1px; }
  .user-role { font-size: 9.5px; margin-top: 2px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; }
  html[data-theme="light"] .user-name { color: var(--ink); }
  html[data-theme="light"] .user-role { color: #8a6a3b; }
  html[data-theme="dark"]  .user-name { color: var(--d-ink); }
  html[data-theme="dark"]  .user-role { color: rgba(201,169,127,0.8); }

  .user-avatar {
    width: 36px; height: 36px; border-radius: 12px;
    background: linear-gradient(140deg, #d8bb90 0%, #a8845a 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 13.5px; font-weight: 800; color: #221a10;
    flex-shrink: 0;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 4px 14px rgba(168,132,90,0.35);
  }

  .logout-btn {
    width: 34px; height: 34px; border-radius: 11px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-backdrop-filter: blur(16px) saturate(170%);
    backdrop-filter: blur(16px) saturate(170%);
    transition: background .2s cubic-bezier(.22,1,.36,1), color .2s ease,
                border-color .2s ease, transform .3s cubic-bezier(.34,1.4,.56,1);
  }
  .logout-btn:active { transform: scale(.94); }
  html[data-theme="light"] .logout-btn {
    background: rgba(255,255,255,0.54); border: 1px solid var(--edge); color: var(--ink-3);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
  }
  html[data-theme="light"] .logout-btn:hover {
    background: rgba(239,68,68,0.14); border-color: rgba(239,68,68,0.34); color: #b91c1c;
  }
  html[data-theme="dark"] .logout-btn {
    background: rgba(255,255,255,0.06); border: 1px solid var(--d-edge-soft); color: var(--d-ink-3);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.09);
  }
  html[data-theme="dark"] .logout-btn:hover {
    background: rgba(239,68,68,0.18); border-color: rgba(239,68,68,0.36); color: #fca5a5;
  }

  /* ─────────────────────────────────────────────────────────────────
     HERO
     ───────────────────────────────────────────────────────────────── */
  .hero { text-align: center; padding: 52px 24px 4px; position: relative; z-index: 2; }
  .hero-eyebrow {
    display: inline-flex; align-items: center; gap: 9px;
    font-size: 9.5px; font-weight: 800; letter-spacing: 2.5px; text-transform: uppercase;
    margin-bottom: 15px;
  }
  .hero-eyebrow::before, .hero-eyebrow::after { content: ''; width: 22px; height: 1px; }
  html[data-theme="light"] .hero-eyebrow { color: #8a6a3b; }
  html[data-theme="light"] .hero-eyebrow::before,
  html[data-theme="light"] .hero-eyebrow::after { background: rgba(138,106,59,0.45); }
  html[data-theme="dark"] .hero-eyebrow { color: rgba(201,169,127,0.75); }
  html[data-theme="dark"] .hero-eyebrow::before,
  html[data-theme="dark"] .hero-eyebrow::after { background: rgba(201,169,127,0.35); }

  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 46px; font-weight: 500; letter-spacing: -0.5px;
  }
  html[data-theme="light"] .hero-title { color: #14161d; }
  html[data-theme="dark"]  .hero-title { color: #f7f3ec; }
  .hero-sub { margin-top: 11px; font-size: 13px; letter-spacing: 0.2px; }
  html[data-theme="light"] .hero-sub { color: var(--ink-2); }
  html[data-theme="dark"]  .hero-sub { color: rgba(255,255,255,0.45); }
  /* Hero girişte cam ardından netleşerek gelir — panellerdeki görünüm
     geçişiyle aynı dil */
  .hero > * { animation: appsIn .6s cubic-bezier(.34,1.4,.56,1) backwards; }
  .hero-eyebrow { animation-delay: .02s; }
  .hero-title   { animation-delay: .08s; }
  .hero-sub     { animation-delay: .14s; }
  @keyframes appsIn {
    from { opacity: 0; transform: translateY(12px) scale(.985); filter: blur(7px); }
    60%  { opacity: 1; filter: blur(0); }
    to   { opacity: 1; transform: none; filter: none; }
  }

  /* ─────────────────────────────────────────────────────────────────
     UYGULAMA KARTLARI — cam
     ───────────────────────────────────────────────────────────────── */
  .apps-wrap { max-width: 1180px; margin: 0 auto; padding: 44px 32px 72px; position: relative; z-index: 2; }
  .apps-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  @media (max-width: 980px) { .apps-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .apps-grid { grid-template-columns: 1fr; } }

  .app-card {
    border-radius: 26px;
    padding: 28px 22px 22px;
    display: flex; flex-direction: column; align-items: flex-start; text-align: left;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    -webkit-backdrop-filter: blur(30px) saturate(190%);
    backdrop-filter: blur(30px) saturate(190%);
    transition: transform .42s cubic-bezier(.34,1.4,.56,1), border-color .28s ease,
                box-shadow .32s ease, background .28s ease;
    animation: appsCardIn .62s cubic-bezier(.34,1.4,.56,1) backwards;
    animation-delay: calc(var(--i, 0) * 70ms + 120ms);
  }
  @keyframes appsCardIn {
    from { opacity: 0; transform: translateY(20px) scale(.955); filter: blur(9px); }
    62%  { opacity: 1; filter: blur(0); }
    to   { opacity: 1; transform: none; filter: none; }
  }
  /* Vurgu ışıması — kartın kendi renginde, üzerine gelince açılır */
  .app-card::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 30% 0%, var(--glow, rgba(201,169,127,0.12)) 0%, transparent 62%);
    opacity: 0; transition: opacity .34s ease;
    pointer-events: none;
  }
  .app-card:hover::before { opacity: 1; }
  .app-card > * { position: relative; z-index: 1; }

  html[data-theme="light"] .app-card {
    background: var(--g-1);
    border: 1px solid var(--edge-soft);
    box-shadow: var(--sh-1), var(--sheen);
  }
  html[data-theme="light"] .app-card:not(.disabled):hover {
    background: var(--g-hover);
    transform: translateY(-6px) scale(1.012);
    border-color: var(--accent-border, rgba(138,106,59,0.4));
    box-shadow: var(--sh-3), var(--sheen);
  }
  html[data-theme="dark"] .app-card {
    background: var(--d-1);
    border: 1px solid var(--d-edge-soft);
    box-shadow: var(--d-sh-1), var(--d-sheen);
  }
  html[data-theme="dark"] .app-card:not(.disabled):hover {
    background: var(--d-3);
    transform: translateY(-6px) scale(1.012);
    border-color: var(--accent-border, rgba(201,169,127,0.4));
    box-shadow: var(--d-sh-3), var(--d-sheen);
  }
  .app-card:not(.disabled):active { transform: translateY(-2px) scale(.995); }

  /* Yakında olanlar: tıklanamaz, soluk ama yine cam */
  .app-card.disabled { cursor: default; }
  .app-card.disabled .app-icon-wrap { filter: grayscale(.55); opacity: .5; }
  html[data-theme="light"] .app-card.disabled { background: var(--g-2); }
  html[data-theme="light"] .app-card.disabled .app-name { color: var(--ink-3); }
  html[data-theme="light"] .app-card.disabled .app-desc { color: rgba(124,132,150,0.75); }
  html[data-theme="dark"]  .app-card.disabled { background: var(--d-2); }
  html[data-theme="dark"]  .app-card.disabled .app-name { color: rgba(255,255,255,0.44); }
  html[data-theme="dark"]  .app-card.disabled .app-desc { color: rgba(255,255,255,0.22); }

  .app-icon-wrap {
    width: 54px; height: 54px;
    border-radius: 17px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    margin-bottom: 18px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.28), 0 8px 22px rgba(0,0,0,0.22);
    transition: transform .42s cubic-bezier(.34,1.56,.64,1);
  }
  .app-card:not(.disabled):hover .app-icon-wrap { transform: scale(1.07) rotate(-3deg); }

  .app-name { font-family: 'Outfit', sans-serif; font-size: 14.5px; font-weight: 600; line-height: 1.35; letter-spacing: -0.1px; }
  .app-desc { font-size: 11.5px; line-height: 1.5; margin-top: 6px; }
  html[data-theme="light"] .app-name { color: var(--ink); }
  html[data-theme="light"] .app-desc { color: var(--ink-2); }
  html[data-theme="dark"]  .app-name { color: #f1f5f9; }
  html[data-theme="dark"]  .app-desc { color: rgba(255,255,255,0.4); }

  .app-footer-row {
    margin-top: 20px;
    display: flex; align-items: center; justify-content: space-between; width: 100%;
  }

  /* Rozetler — pastel cam (panellerdeki rozet diliyle aynı) */
  .app-badge {
    font-size: 8.5px; font-weight: 800; letter-spacing: 0.8px;
    text-transform: uppercase;
    padding: 4px 11px; border-radius: 999px;
    -webkit-backdrop-filter: blur(12px) saturate(160%);
    backdrop-filter: blur(12px) saturate(160%);
  }
  html[data-theme="light"] .app-badge.active   { background: rgba(34,197,94,0.22);  border: 1px solid rgba(34,197,94,0.4);  color: #10602f; }
  html[data-theme="light"] .app-badge.soon     { background: rgba(23,43,99,0.09);   border: 1px solid rgba(23,43,99,0.15);  color: var(--ink-2); }
  html[data-theme="light"] .app-badge.external { background: rgba(59,130,246,0.20); border: 1px solid rgba(59,130,246,0.38); color: #1e40af; }
  html[data-theme="dark"]  .app-badge.active   { background: rgba(74,222,128,0.14); border: 1px solid rgba(74,222,128,0.3);  color: #4ade80; }
  html[data-theme="dark"]  .app-badge.soon     { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.13); color: rgba(255,255,255,0.42); }
  html[data-theme="dark"]  .app-badge.external { background: rgba(96,165,250,0.15); border: 1px solid rgba(96,165,250,0.32); color: #60a5fa; }

  .app-arrow {
    width: 27px; height: 27px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    backdrop-filter: blur(14px) saturate(160%);
    transition: background .24s ease, color .24s ease, border-color .24s ease,
                transform .38s cubic-bezier(.34,1.56,.64,1);
  }
  html[data-theme="light"] .app-arrow { background: rgba(255,255,255,0.5); border: 1px solid var(--edge); color: var(--ink-3); }
  html[data-theme="dark"]  .app-arrow { background: rgba(255,255,255,0.06); border: 1px solid var(--d-edge-soft); color: rgba(255,255,255,0.38); }
  .app-card:not(.disabled):hover .app-arrow {
    background: var(--accent-bg, #c9a97f);
    border-color: transparent;
    color: #16130d;
    transform: translateX(3px) scale(1.08);
  }

  .footer-note { text-align: center; font-size: 10.5px; margin-top: 52px; letter-spacing: 0.3px; }
  html[data-theme="light"] .footer-note { color: rgba(124,132,150,0.85); }
  html[data-theme="dark"]  .footer-note { color: rgba(255,255,255,0.18); }

  /* ─────────────────────────────────────────────────────────────────
     "Yakında" bildirimi — cam tost
     ───────────────────────────────────────────────────────────────── */
  #miniToast {
    position: fixed;
    bottom: 32px; left: 50%;
    transform: translateX(-50%) translateY(22px) scale(.96);
    z-index: 9999;
    border-radius: 16px;
    padding: 13px 22px;
    font-size: 12.5px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    -webkit-backdrop-filter: blur(34px) saturate(190%);
    backdrop-filter: blur(34px) saturate(190%);
    transition: opacity .28s ease, transform .46s cubic-bezier(.34,1.4,.56,1);
    white-space: nowrap;
    max-width: calc(100vw - 32px);
    overflow: hidden; text-overflow: ellipsis;
  }
  #miniToast.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  html[data-theme="light"] #miniToast {
    background: rgba(255,255,255,0.72);
    border: 1px solid var(--edge);
    color: var(--ink);
    box-shadow: var(--sh-3), var(--sheen);
  }
  html[data-theme="dark"] #miniToast {
    background: var(--d-strong);
    border: 1px solid var(--d-edge);
    color: var(--d-ink);
    box-shadow: var(--d-sh-3), var(--d-sheen);
  }

  @media (prefers-reduced-motion: reduce) {
    .hero > *, .app-card { animation: none !important; }
    .app-card, .app-icon-wrap, .app-arrow, #miniToast { transition-duration: .01s !important; }
  }
</style>
</head>
<body>
  <div class="grain-line"></div>

  <div class="topbar">
    <div class="logo-mini-wrap">
      <div class="logo-mini">
        <span class="logo-mini-text">natural</span><span class="logo-mini-dot">.</span>
      </div>
      <span class="logo-mini-clinic">clinic</span>
    </div>
    <div class="topbar-right">
      <!-- Dil: liquid-ui.js bu mount'u cam açılır listeye (.lang-dd) çeviriyor;
           aşağıdaki renderLangToggle() yedek olarak duruyor (JS kapalıysa /
           liquid-ui.js yüklenmezse TR/EN pill'i görünsün). -->
      <div class="lang-toggle" id="langToggleMount"></div>

      <!-- Sinematik tema anahtarı — panellerdekiyle AYNI bileşen
           (liquid-glass.css 30. bölüm, tema kapsamı dışında tanımlı). -->
      <button id="themeSwitch" class="cine-box" onclick="toggleThemeMode()" role="switch" aria-checked="false" aria-label="Tema değiştir" title="Açık / Koyu tema">
        <span class="cine-box-label" id="themeToggleLabel">Görünüm</span>
        <span class="cine-switch" aria-hidden="true">
          <span class="cine-groove"></span>
          <span class="cine-gloss"></span>
          <span class="cine-ao"></span>
          <span class="cine-bg-icons">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>
          </span>
          <span class="cine-thumb">
            <span class="cine-thumb-gloss"></span>
            <span class="cine-particle cine-p1"></span>
            <span class="cine-particle cine-p2"></span>
            <span class="cine-particle cine-p3"></span>
            <svg class="cine-thumb-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            <svg class="cine-thumb-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>
          </span>
        </span>
      </button>

      <div class="user-area">
        <div class="user-info">
          <div class="user-name" id="uaName">—</div>
          <div class="user-role" id="uaRole">—</div>
        </div>
        <div class="user-avatar" id="uaAvatar">—</div>
        <button class="logout-btn" onclick="logout()" title="Çıkış">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="hero">
    <div class="hero-eyebrow">Natural Clinic</div>
    <div class="hero-title">Uygulamalarınız</div>
    <div class="hero-sub">Devam etmek için bir uygulama seçin</div>
  </div>

  <div class="apps-wrap">
    <div class="apps-grid" id="appsGrid"></div>
    <div class="footer-note">Natural Clinic &copy; 2026 &middot; İç Sistemler Portalı</div>
  </div>

  <div id="miniToast"></div>

<script>
  const currentUser = JSON.parse(sessionStorage.getItem('nc_current_user') || 'null');
  if (!currentUser || !currentUser.role) {
    window.location.href = 'index.html';
  }

  document.getElementById('uaName').textContent = currentUser.fullName || currentUser.username || '—';
  document.getElementById('uaRole').textContent = I18N.t(({
    'agent': 'Danışman', 'team-leader': 'Takım Lideri', 'admin': 'Admin',
    'super-admin': 'Süper Admin', 'regional-manager': 'Bölge Müdürü'
  })[currentUser.role] || currentUser.role);
  document.getElementById('uaAvatar').textContent = (currentUser.fullName || currentUser.username || '?').trim().charAt(0).toUpperCase();

  function alarmSystemUrl() {
    if (currentUser.role === 'agent') return 'agent.html';
    if (currentUser.role === 'team-leader') return 'team-leader.html';
    return 'admin.html'; // admin, super-admin, regional-manager
  }

  const APPS = [
    {
      key: 'pdks',
      name: 'Natural Clinic PDKS',
      desc: 'Personel Devam Kontrol Sistemi',
      status: 'soon',
      accent: '#60a5fa',
      accentBg: 'rgba(96,165,250,0.12)',
      iconBg: 'linear-gradient(135deg, #2563eb 0%, #1e3a8a 100%)',
      icon: `<svg width="26" height="26" fill="none" viewBox="0 0 24 24" stroke="#bfdbfe" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 7v5l3.5 2"/></svg>`
    },
    {
      key: 'alarm',
      name: 'Natural Clinic Takım Lideri Alarm Takip Sistemi',
      desc: 'Deal, alarm ve ekip takip paneli',
      status: 'active',
      accent: '#f87171',
      accentBg: 'rgba(248,113,113,0.12)',
      iconBg: 'linear-gradient(135deg, #dc2626 0%, #7f1d1d 100%)',
      icon: `<svg width="26" height="26" fill="none" viewBox="0 0 24 24" stroke="#fecaca" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2a2 2 0 01-.6 1.4L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>`
    },
    {
      key: 'dashboard',
      name: 'Natural Clinic Dashboard',
      desc: 'Genel performans ve raporlama',
      // Sadece admin/super-admin için aktif — takım lideri/RM'de "Yakında" görünmeye devam eder.
      status: (currentUser.role === 'admin' || currentUser.role === 'super-admin') ? 'active' : 'soon',
      url: 'https://nc-dashboards.vercel.app/login',
      sameTab: true, // ayrı sekme değil, alt domain gibi aynı sekmede açılsın
      accent: '#34d399',
      accentBg: 'rgba(52,211,153,0.12)',
      iconBg: 'linear-gradient(135deg, #059669 0%, #064e3b 100%)',
      icon: `<svg width="26" height="26" fill="none" viewBox="0 0 24 24" stroke="#a7f3d0" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17V9m3 8V5m3 12v-4M4 21h16"/></svg>`
    },
    {
      key: 'quality',
      name: 'Quality Training',
      desc: 'Eğitim ve kalite kontrol modülü',
      status: 'external',
      url: 'https://nc-quality-control.vercel.app/login',
      accent: '#c9a97f',
      accentBg: 'rgba(201,169,127,0.14)',
      iconBg: 'linear-gradient(135deg, #c9a97f 0%, #a8845a 100%)',
      icon: `<svg width="26" height="26" fill="none" viewBox="0 0 24 24" stroke="#1c1917" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5zm0 0l9-5v6M12 14v7m-6-4v3.2c0 .5.3.9.7 1.1C8.1 22 10 22.5 12 22.5s3.9-.5 5.3-1.2c.4-.2.7-.6.7-1.1V13"/></svg>`
    }
  ];

  const BADGE_LABEL = { active: 'Aktif', soon: 'Yakında', external: 'Harici' };
  const ARROW_ICON = `<svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>`;
  const CHECK_ICON = `<svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>`;
  const CLOCK_ICON = `<svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l2.5 1.5"/></svg>`;

  function renderApps() {
    const grid = document.getElementById('appsGrid');
    grid.innerHTML = APPS.map((a, idx) => {
      const disabled = a.status === 'soon';
      const arrowIcon = disabled ? CLOCK_ICON : (a.status === 'external' ? ARROW_ICON : CHECK_ICON);
      return `<div class="app-card${disabled ? ' disabled' : ''}" style="--i:${idx};--glow:${a.accentBg};--accent-border:${a.accent}55;--accent-bg:${a.accent}" onclick="${disabled ? `showSoonToast('${a.name.replace(/'/g, "\\'")}')` : `openApp('${a.key}')`}">
        <div class="app-icon-wrap" style="background:${a.iconBg}">${a.icon}</div>
        <div class="app-name">${I18N.t(a.name)}</div>
        <div class="app-desc">${I18N.t(a.desc)}</div>
        <div class="app-footer-row">
          <span class="app-badge ${a.status}">${I18N.t(BADGE_LABEL[a.status])}</span>
          <span class="app-arrow">${arrowIcon}</span>
        </div>
      </div>`;
    }).join('');
  }
  renderApps();

  function openApp(key) {
    const app = APPS.find(a => a.key === key);
    if (!app) return;
    if (app.key === 'alarm') { window.location.href = alarmSystemUrl(); return; }
    if (app.url) {
      if (app.sameTab) { window.location.href = app.url; return; }
      window.open(app.url, '_blank', 'noopener');
      return;
    }
  }

  function showSoonToast(name) {
    const t = document.getElementById('miniToast');
    t.textContent = `${name} — ${I18N.t('çok yakında aktif olacak.')}`;
    t.classList.add('show');
    clearTimeout(window._soonTimer);
    window._soonTimer = setTimeout(() => t.classList.remove('show'), 2400);
  }

  function logout() {
    sessionStorage.removeItem('nc_current_user');
    window.location.href = 'index.html';
  }

  // Tema anahtari — panellerdeki toggleThemeMode ile birebir ayni davranis:
  // secim localStorage'da tutulur (tum sayfalar ayni anahtari okur), sayfa
  // YENILENMEZ, kol yay fizigiyle kayar ve parcacik patlamasi tetiklenir.
  function toggleThemeMode() {
    var cur  = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    var next = cur === 'dark' ? 'light' : 'dark';
    localStorage.setItem('nc_theme', next);
    document.documentElement.setAttribute('data-theme', next);
    var sw = document.getElementById('themeSwitch');
    if (sw) {
      sw.setAttribute('aria-checked', String(next === 'dark'));
      sw.classList.remove('cine-burst'); void sw.offsetWidth; sw.classList.add('cine-burst');
    }
  }
  document.getElementById('themeSwitch')
    .setAttribute('aria-checked', String(document.documentElement.getAttribute('data-theme') === 'dark'));

  // Dil değiştirme pilli (diğer panellerdeki I18N.renderToggleButton yerine
  // burada özel stil kullanıyoruz — header'daki lang-toggle kapsülüne uysun diye)
  function renderLangToggle() {
    const lang = I18N.getLang();
    document.getElementById('langToggleMount').innerHTML =
      `<button class="${lang === 'tr' ? 'active' : ''}" onclick="I18N.setLangAndReload('tr')">TR</button>` +
      `<button class="${lang === 'en' ? 'active' : ''}" onclick="I18N.setLangAndReload('en')">EN</button>`;
  }
  renderLangToggle();

  if (I18N.getLang() === 'en') I18N.translateDOM(document.body);
</script>
<!-- Cam dil acilir listesi + segment/select gelistirmeleri.
     DOM hazir olduktan SONRA yuklenmeli: #langToggleMount'u yeniden yaziyor. -->
<script src="liquid-ui.js"></script>
</body>
</html>
